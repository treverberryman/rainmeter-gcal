[Rainmeter]
Update=1000
AccurateText=1
UseD2D=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
MouseActionCursor=1
DefaultAlwaysOnTop=2
OnRefreshAction=[!ZPos 2]

[Metadata]
Name=Google Calendar Flyout
Author=Codex
Information=Expanded agenda flyout for the Google Calendar launcher skin.
Version=0.1.0
License=MIT

[Variables]
@Include1=#CURRENTPATH#..\@Resources\Variables.inc
@Include2=#CURRENTPATH#..\@Resources\Styles.inc
@Include3=#CURRENTPATH#..\@Resources\Data\DayTimeline.generated.variables.inc
ExpandedPanelX=0
CollapsedPanelX=-420
PanelX=0
PanelHidden=0

[DayTimelineGenerated]
@Include=#CURRENTPATH#..\@Resources\Data\DayTimeline.generated.inc

[MeasureScript]
Measure=Script
ScriptFile=#CURRENTPATH#..\@Resources\Scripts\Calendar.lua

[MeasureRunSync]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#CURRENTPATH#..\tools\Sync-IcalCalendar.ps1" -OutputPath "#CURRENTPATH#..\@Resources\Data\CalendarCache.lua" -ConfigPath "#CURRENTPATH#..\tools\IcalCalendar.config.json"
State=Hide
FinishAction=[!CommandMeasure MeasureScript "RefreshData()"][!Refresh]
OutputType=ANSI
OutputFile=#CURRENTPATH#..\tools\LastSyncOutput.txt
DynamicVariables=1

[MeasureRunSetup]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#CURRENTPATH#..\tools\Open-IcalCalendarSetup.ps1" -ConfigPath "#CURRENTPATH#..\tools\IcalCalendar.config.json" -ExamplePath "#CURRENTPATH#..\tools\IcalCalendar.config.example.json"
State=Show
DynamicVariables=1

[MeasureNowDate]
Measure=Time
Format=%A, %b %d

[MeasureWeek]
Measure=Time
Format=WK %V

[MeterPanel]
Meter=Shape
Group=Flyout
Shape=Rectangle #PanelX#,#PanelY#,#PanelWidth#,#PanelHeight#,18 | Fill Color #PanelColor# | StrokeWidth 1 | Stroke Color #BorderColor#
Hidden=#PanelHidden#
MouseScrollUpAction=[!CommandMeasure MeasureScript "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure MeasureScript "Scroll(1)"]
DynamicVariables=1

[MeterHeaderTitle]
Meter=String
Group=Flyout
MeterStyle=StyleHeader
X=(#PanelX#+20)
Y=(#PanelY#+16)
Text=Google Calendar
Hidden=#PanelHidden#
DynamicVariables=1

