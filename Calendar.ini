[Rainmeter]
Update=10
AccurateText=1
UseD2D=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
MouseActionCursor=1
DefaultAlwaysOnTop=2
OnRefreshAction=[!ZPos 2]

[Metadata]
Name=Google Calendar
Author=Codex
Information=Collapsed launcher icon for the Google Calendar flyout skin.
Version=0.1.0
License=MIT

[Variables]
@Include1=#@#Variables.inc
@Include2=#@#Styles.inc

[MeasureLauncherScript]
Measure=Script
ScriptFile=#@#Scripts\Launcher.lua

[MeasureMonth]
Measure=Time
Format=%b

[MeasureDay]
Measure=Time
Format=%d

[MeterCollapsedHitbox]
Meter=Shape
X=0
Y=0
W=#CollapsedSize#
H=#CollapsedSize#
Shape=Rectangle 0,0,#CollapsedSize#,#CollapsedSize#,12 | Fill Color #IconPlateColor# | StrokeWidth 0
LeftMouseUpAction=[!CommandMeasure MeasureLauncherScript "OpenFlyout()"]
MouseOverAction=[!SetOption MeterIconLabel FontColor "#AccentColor#"][!UpdateMeter MeterIconLabel][!Redraw]
MouseLeaveAction=[!SetOption MeterIconLabel FontColor "#MutedTextColor#"][!UpdateMeter MeterIconLabel][!Redraw]
DynamicVariables=1

[MeterCollapsedTopShadow]
Meter=Shape
X=0
Y=0
Shape=Line 10,6,(#CollapsedSize#-10),6 | StrokeWidth 1 | Stroke Color #IconShadowColor#
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureLauncherScript "OpenFlyout()"]

[MeterCollapsedLeftShadow]
Meter=Shape
X=0
Y=0
Shape=Line 6,10,6,(#CollapsedSize#-10) | StrokeWidth 1 | Stroke Color #IconShadowColor#
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureLauncherScript "OpenFlyout()"]

[MeterCollapsedBottomHighlight]
Meter=Shape
X=0
Y=0
Shape=Line 12,(#CollapsedSize#-5),(#CollapsedSize#-14),(#CollapsedSize#-5) | StrokeWidth 2 | Stroke Color #IconHighlightColor#
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureLauncherScript "OpenFlyout()"]

[MeterCollapsedRightHighlight]
Meter=Shape
X=0
Y=0
Shape=Line (#CollapsedSize#-5),12,(#CollapsedSize#-5),(#CollapsedSize#-14) | StrokeWidth 2 | Stroke Color #IconHighlightColor#
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureLauncherScript "OpenFlyout()"]

[MeterIconMonth]
Meter=String
MeterStyle=StyleIconMonth
X=(#CollapsedSize#/2)
Y=12
MeasureName=MeasureMonth
Text=%1
StringCase=Upper
LeftMouseUpAction=[!CommandMeasure MeasureLauncherScript "OpenFlyout()"]
DynamicVariables=1

[MeterIconDay]
Meter=String
MeterStyle=StyleIconDay
X=(#CollapsedSize#/2)
Y=34
MeasureName=MeasureDay
Text=%1
LeftMouseUpAction=[!CommandMeasure MeasureLauncherScript "OpenFlyout()"]
DynamicVariables=1
